<body>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2500684137043103&ev=PageView&noscript=1"/></noscript>
<audio id="kairo-notif" src="notif.mp3" preload="auto"></audio>
<div id="root"></div>
<script>
(function(){
  var audio=document.getElementById('kairo-notif');
  var lastPlay=0;
  function play(){
    var now=Date.now();
    if(now-lastPlay<600)return;
    lastPlay=now;
    try{audio.currentTime=0;var p=audio.play();if(p&&p.catch)p.catch(function(){});}catch(e){}
  }
  // Unlock audio after first user interaction (autoplay policy)
  function unlock(){
    try{audio.muted=true;audio.play().then(function(){audio.pause();audio.muted=false;audio.currentTime=0;play();}).catch(function(){audio.muted=false;});}catch(e){}
    document.removeEventListener('click',unlock);
    document.removeEventListener('touchstart',unlock);
    document.removeEventListener('keydown',unlock);
  }
  document.addEventListener('click',unlock,{once:true});
  document.addEventListener('touchstart',unlock,{once:true});
  document.addEventListener('keydown',unlock,{once:true});

  // Watch for new bot messages
  function isMessageNode(n){
    if(!(n instanceof HTMLElement))return false;
    var t=(n.innerText||'').trim();
    if(!t||t.length<2)return false;
    // Heuristic: look for chat bubbles (rounded boxes) added to scroll area
    var cls=(n.className||'')+'';
    if(/input|textarea|button/i.test(n.tagName))return false;
    return /rounded|bg-\[|bubble|message/i.test(cls) || n.querySelector && n.querySelector('p,span');
  }
  var obs=new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      var m=muts[i];
      for(var j=0;j<m.addedNodes.length;j++){
        var node=m.addedNodes[j];
        if(node.nodeType===1 && isMessageNode(node)){
          play();
          return;
        }
      }
    }
  });
  var startObs=function(){
    var root=document.getElementById('root');
    if(!root||!root.firstChild){return setTimeout(startObs,200);}
    obs.observe(root,{childList:true,subtree:true});
    // Initial chat-open notification
    setTimeout(play,800);
  };
  startObs();
})();
</script>
